<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/immagini/logo.png">
    <title>Gestione contenuti — Corsi</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=PT+Sans:400,400i,700">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Abril+Fatface">
    <link rel="stylesheet" href="/corsi/css/poole.css">
    <link rel="stylesheet" href="/corsi/css/hyde.css">
    <link rel="stylesheet" href="/corsi/css/syntax.css">
    <link rel="stylesheet" href="/corsi/corsi-app.css?v=70">
    <script src="/seasonal-theme.js?v=5"></script>
    <link rel="stylesheet" href="/seasonal-theme.css?v=24">
</head>
<body data-corsi-page="manage">
    <div id="authOverlay"><span>Verifica autenticazione...</span></div>

    <div class="sidebar">
        <div class="container">
            <div class="sidebar-about">
                <h1 id="siteTitle">Corsi</h1>
                <p class="lead" id="siteDescription">Gestione contenuti didattici.</p>
            </div>

            <nav class="sidebar-nav" id="sidebarNav" aria-label="Navigazione corsi"></nav>

            <div class="sidebar-actions">
                <a class="btn-portal" href="/corsi">Annulla</a>
            </div>
        </div>
    </div>

    <div class="content container">
        <div id="corsiLiveAlerts" class="corsi-live-alerts" aria-live="polite"></div>
        <div id="contentRoot" class="page">
            <p>Caricamento...</p>
        </div>
    </div>

    <div id="confirmModal" class="corsi-modal" style="display:none;" role="dialog" aria-modal="true">
        <div class="corsi-modal-box">
            <p id="confirmMsg">Confermi?</p>
            <div class="corsi-modal-actions">
                <button type="button" id="confirmCancel">Annulla</button>
                <button type="button" id="confirmOk">Elimina</button>
            </div>
        </div>
    </div>

    <script src="/auth-token.js?v=2"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="/corsi-export.js?v=9"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
    <script src="/corsi/js/highlight.min.js?v=2"></script>
    <script src="/corsi.js?v=70"></script>
</body>
</html>
