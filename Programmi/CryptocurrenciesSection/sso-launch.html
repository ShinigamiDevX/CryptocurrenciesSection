    (async function () {
        var params = new URLSearchParams(location.search);
        var tool = params.get('tool') || '';
        var next = params.get('next') || '';
        if (typeof openToolWithSso === 'function') {
            await openToolWithSso(tool, next, '_self');

        else location.replace('/portal');
    })();
