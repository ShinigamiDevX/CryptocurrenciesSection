upstream cluster_app {
    server cluster:3000;
}

upstream auth_app {
    server auth:4000;
}

# Maschera token=... nei log access (query string)
map $request_uri $log_request_uri {
    default $request_uri;
    "~^(?<p>.*[?&](?:token|ticket|sso)=)[^&]*(?<s>.*)$" "${p}REDACTED${s}";
}

log_format scrubbed '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $log_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

server {
    listen 80;
    server_name cryptosection.chainholder.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
    # Primo accesso da IP: scarico CA in HTTP. Tutto il resto va su HTTPS :443.
    root /usr/share/nginx/html;

    location = /ca/Portale-LAN-CA.crt {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'inline; filename="Portale-LAN-CA.crt"';
        try_files /ca/Portale-LAN-CA.crt =404;
    }

    location = /installa-certificato {
        try_files /installa-certificato.html =404;
    }

    location = /installa-certificato.html {
        try_files /installa-certificato.html =404;
    }

    location = /login {
        try_files /installa-certificato.html =404;
    }
    location = /login.html {
        try_files /installa-certificato.html =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name cryptosection.chainholder.dev;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/access.log scrubbed;

    root  /usr/share/nginx/html;
    index index.html;

    # Nega l'accesso a file nascosti (.env, .git, ecc.)
    location ~ /\. {
        deny all;
    }

    # Il volume web monta l'intero progetto: blocca DB, secret e codice auth.
    location ^~ /auth/data/ {
        deny all;
        return 404;
    }
    location ^~ /auth/ {
        deny all;
        return 404;
    }
    location = /cluster.env {
        deny all;
        return 404;
    }
    location = /docker-compose.yml {
        deny all;
        return 404;
    }
    location ~* \.(db|db-wal|db-shm|env|key|pem)$ {
        deny all;
        return 404;
    }

    # Modello Seed Phrase: non esporre il .docx via web (generazione solo server-side)
    location ~* "^/files/SEED( |%20)PHRASE\.docx$" {
        deny all;
        return 404;
    }

    # Upload documenti Criptogram: streaming senza limite dimensione lato proxy
    location = /api/auth/messages/upload {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_upstream http://auth:4000;
        proxy_pass         $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-File-Name       $http_x_file_name;
        proxy_set_header   X-File-Mime       $http_x_file_mime;
    }

    # Download allegati Criptogram (documenti grandi): niente buffering, timeout lunghi
    location ~ ^/api/auth/messages/attachment/ {
        client_max_body_size 1m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_upstream http://auth:4000;
        proxy_pass         $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Auth API (client_max_body_size alto per upload immagini corsi)
    # resolver Docker: evita 502 se il container auth viene ricreato (IP cambia)
    location /api/auth/ {
        client_max_body_size 16m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_upstream http://auth:4000;
        proxy_pass         $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Pagina portale protetta
    location = /portal {
        try_files /portal.html =404;
    }

    location = /sso-launch {
        try_files /sso-launch.html =404;
    }

    # Gestione Utenti (pagina admin)
    location = /gestione-utenti {
        try_files /gestione-utenti.html =404;
    }

    # Pagina profilo utente
    location = /profilo {
        try_files /profilo.html =404;
    }

    # Analisi Report
    location = /analisi-report {
        try_files /analisi-report.html =404;
    }

    location = /cryptoscanner {
        try_files /cryptoscanner.html =404;
    }

    location = /la-bibbia {
        try_files /la-bibbia.html =404;
    }

    location = /seed-phrase {
        try_files /seed-phrase.html =404;
    }

    location = /idee {
        try_files /idee.html =404;
    }

    location = /tools-europol {
        try_files /tools-europol.html =404;
    }

    location = /xpublicator {
        try_files /xpublicator.html =404;
    }

    location = /li-tools {
        try_files /li-tools.html =404;
    }

    location = /siena-constructor {
        absolute_redirect off;
        return 301 /siena-constructor/;
    }

    location /siena-constructor/ {
        try_files $uri $uri/ =404;
    }

    location ^~ /cryptoscanner/ {
        deny all;
    }

    location ^~ /xpublicator/ {
        deny all;
    }

    location ^~ /li-tools/ {
        deny all;
    }

    location /api/cryptoscanner/ {
        client_max_body_size 80m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cryptoscanner_upstream http://cryptoscanner:5002;
        proxy_pass         $cryptoscanner_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location /api/xpublicator/ {
        client_max_body_size 1m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $xpublicator_upstream http://xpublicator:5003;
        proxy_pass         $xpublicator_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/li-tools/ {
        client_max_body_size 200m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $litools_upstream http://li-tools:5004;
        proxy_pass         $litools_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location /api/analisi/ {
        client_max_body_size 30m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $analisi_upstream http://analisi:5001;
        proxy_pass         $analisi_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Corsi (materiali Markdown, tema Hyde)
    location = /corsi {
        try_files /corsi.html =404;
    }

    # I contenuti dei corsi stanno nel database e passano solo da /api/auth/corsi/,
    # che verifica il token. I vecchi file restano sul disco come backup: qui li
    # rendiamo irraggiungibili dall'esterno. Restano pubblici CSS e immagini.
    location ~ ^/corsi/.+\.md$ {
        return 404;
    }

    location = /corsi/manifest.json {
        return 404;
    }

    location = /corsi-storico {
        try_files /corsi-storico.html =404;
    }

    location = /corsi-gestione {
        try_files /corsi-gestione.html =404;
    }

    # Pagina login
    location = /login {
        try_files /login.html =404;
    }

    location = /installa-certificato {
        try_files /installa-certificato.html =404;
    }

    location = /ca/Portale-LAN-CA.crt {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'inline; filename="Portale-LAN-CA.crt"';
        try_files /ca/Portale-LAN-CA.crt =404;
    }

    # Pagina registrazione
    location = /register {
        try_files /register.html =404;
    }

    # Pagina reset password
    location = /reset-password {
        try_files /reset-password.html =404;
    }

    # Strumento Cluster — proxy verso il servizio Node.js
    location /cluster/ {
        proxy_pass         http://cluster_app/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Supporto SSE (Server-Sent Events)
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
