<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://world.openfoodfacts.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <title>Dashboard - Gestione Materiale Informatico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="theme-toggle" id="themeToggle" aria-label="Cambia tema">
                <span id="themeIcon">🌙</span>
            </button>
            <h2 class="sidebar-title">Menu</h2>
        </div>
        <div class="sidebar-anno" style="padding: 12px 24px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem;">
            <span class="sidebar-text">Anno <strong id="sidebarAnno">—</strong></span>
            <a href="home.html" class="sidebar-link" style="padding: 8px 0; margin-top: 4px;">Cambia anno</a>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidebar-link">
                <span class="sidebar-icon">📊</span>
                <span class="sidebar-text">Dashboard</span>
            </a>
            <a href="fondi.html" class="sidebar-link">
                <span class="sidebar-icon">💰</span>
                <span class="sidebar-text">Fondi</span>
            </a>
            <a href="materiale.html" class="sidebar-link">
                <span class="sidebar-icon">💻</span>
                <span class="sidebar-text">Materiale</span>
            </a>
            <a href="licenze.html" class="sidebar-link">
                <span class="sidebar-icon">📜</span>
                <span class="sidebar-text">Licenze</span>
            </a>
            <a href="personale.html" class="sidebar-link">
                <span class="sidebar-icon">👤</span>
                <span class="sidebar-text">Personale</span>
            </a>
        </nav>
    </aside>

    <div class="container">
        <header>
            <h1>DATABASE MAGAZZINO</h1>
            <div class="header-search">
                <input type="text" id="globalSearch" class="search-input" placeholder="🔍 Cerca...">
            </div>
        </header>

        <div class="main-content">
            <div class="stats" id="generalStats"></div>

            <div class="form-section">
                <h2 style="margin: 0 0 20px 0;">Resoconto Fondi</h2>
                
                <div id="fondiResoconto"></div>
            </div>

            <div class="form-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
                    <h2 style="margin: 0;">Resoconto Materiale</h2>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <select id="materialeSort" class="sort-select">
                            <option value="nome-asc">Ordina per: Nome (A-Z)</option>
                            <option value="nome-desc">Ordina per: Nome (Z-A)</option>
                            <option value="costo-asc">Ordina per: Costo ↑</option>
                            <option value="costo-desc">Ordina per: Costo ↓</option>
                            <option value="fondo-asc">Ordina per: Fondo (A-Z)</option>
                            <option value="fondo-desc">Ordina per: Fondo (Z-A)</option>
                        </select>
                        <select id="materialeFilterFondo" class="filter-select">
                            <option value="">Tutti i fondi</option>
                        </select>
                        <select id="materialeFilterStato" class="filter-select">
                            <option value="">Tutti gli stati</option>
                            <option value="Magazzino">In Magazzino</option>
                            <option value="In Uso">In Uso</option>
                        </select>
                        <input type="text" id="materialeFilter" class="filter-input" placeholder="🔍 Filtra">
                    </div>
                </div>
                
                <div id="materialeResoconto"></div>
            </div>

            <div class="form-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
                    <h2 style="margin: 0;">Resoconto Licenze</h2>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <select id="licenzeSort" class="sort-select">
                            <option value="nome-asc">Ordina per: Nome (A-Z)</option>
                            <option value="nome-desc">Ordina per: Nome (Z-A)</option>
                            <option value="dataScadenza-asc">Ordina per: Scadenza ↑</option>
                            <option value="dataScadenza-desc">Ordina per: Scadenza ↓</option>
                            <option value="costo-asc">Ordina per: Costo ↑</option>
                            <option value="costo-desc">Ordina per: Costo ↓</option>
                        </select>
                        <select id="licenzeFilterStato" class="filter-select">
                            <option value="">Tutti gli stati</option>
                            <option value="attiva">Attiva</option>
                            <option value="in-scadenza">In Scadenza</option>
                            <option value="scaduta">Scaduta</option>
                        </select>
                        <input type="text" id="licenzeFilter" class="filter-input" placeholder="🔍 Filtra">
                    </div>
                </div>
                
                <div id="licenzeResoconto"></div>
            </div>
        </div>
    </div>

    <script src="js/db-storage.js"></script>
    <script src="js/escape-utils.js"></script>
    <script>
        // Anno di lavoro: da sessionStorage, URL (solo 4 cifre) o anno corrente
        function getMaterialiAnno() {
            const fromSession = sessionStorage.getItem('materiali_anno');
            if (fromSession && /^\d{4}$/.test(fromSession)) return fromSession;
            const fromUrl = new URLSearchParams(window.location.search).get('anno');
            if (fromUrl && /^\d{4}$/.test(fromUrl)) return fromUrl;
            return String(new Date().getFullYear());
        }
        const ANNO = getMaterialiAnno();
        if (!sessionStorage.getItem('materiali_anno')) sessionStorage.setItem('materiali_anno', ANNO);

        // Chiavi dati (DB per anno)
        const FONDI_STORAGE_KEY = 'fondi_database_' + ANNO;
        const MATERIALE_STORAGE_KEY = 'materiale_informatico_' + ANNO;
        const LICENZE_STORAGE_KEY = 'licenze_database_' + ANNO;

        if (document.getElementById('sidebarAnno')) document.getElementById('sidebarAnno').textContent = ANNO;

        function loadFondi() {
            if (!window.DBStorage) return [];
            return DBStorage.getArray(FONDI_STORAGE_KEY);
        }

        function loadMateriale() {
            if (!window.DBStorage) return [];
            return DBStorage.getArray(MATERIALE_STORAGE_KEY);
        }

        function loadLicenze() {
            if (!window.DBStorage) return [];
            return DBStorage.getArray(LICENZE_STORAGE_KEY);
        }

        // Calcola stato licenza
        function getStatoLicenza(dataScadenza) {
            if (!dataScadenza) return 'attiva';
            
            const oggi = new Date();
            oggi.setHours(0, 0, 0, 0);
            const scadenza = new Date(dataScadenza);
            scadenza.setHours(0, 0, 0, 0);
            
            const giorniRimanenti = Math.ceil((scadenza - oggi) / (1000 * 60 * 60 * 24));
            
            if (giorniRimanenti < 0) return 'scaduta';
            if (giorniRimanenti <= 30) return 'in-scadenza';
            return 'attiva';
        }

        // Ottieni classe badge per stato licenza
        function getStatoBadgeClass(stato) {
            const classMap = {
                'attiva': 'badge-magazzino',
                'in-scadenza': 'badge-in-uso',
                'scaduta': 'badge-altro'
            };
            return classMap[stato] || 'badge-altro';
        }

        // Ottieni classe badge per fondo
        function getFondoBadgeClass(fondo) {
            const classMap = {
                'Fondi Europei': 'badge-fondi-europei',
                'Arma dei Carabinieri': 'badge-carabinieri',
                'Europol': 'badge-europol',
                'Altro': 'badge-altro'
            };
            return classMap[fondo] || 'badge-altro';
        }

        function renderGeneralStats() {
            const fondi = loadFondi();
            const materiale = loadMateriale();
            
            const totaleMateriale = materiale.length;
            const totaleBudget = fondi.reduce((sum, f) => sum + (parseFloat(f.budgetIniziale) || 0), 0);
            const totaleCostoMateriale = materiale.reduce((sum, m) => sum + (parseFloat(m.costo) || 0), 0);

            const statsHTML = `
                <div class="stat-card">
                    <h3>${totaleMateriale}</h3>
                    <p>Pezzi Materiale</p>
                </div>
                <div class="stat-card">
                    <h3>€${totaleBudget.toLocaleString('it-IT', {minimumFractionDigits: 2})}</h3>
                    <p>Budget Totale</p>
                </div>
                <div class="stat-card">
                    <h3>€${totaleCostoMateriale.toLocaleString('it-IT', {minimumFractionDigits: 2})}</h3>
                    <p>Valore Materiale</p>
                </div>
            `;

            document.getElementById('generalStats').innerHTML = statsHTML;
        }

        let materialeData = [];

        function renderFondiResoconto(fondiToRender = null) {
            let fondi = fondiToRender || loadFondi();
            const materiale = loadMateriale();

            if (fondi.length === 0) {
                document.getElementById('fondiResoconto').innerHTML = `
                    <p style="color: var(--text-secondary); text-align: center; padding: 20px;">
                        Nessun fondo trovato. <a href="fondi.html" style="color: var(--accent-primary);">Aggiungi il primo fondo</a>
                    </p>
                `;
                return;
            }

            const ordineFondi = ['Fondi Europei', 'Europol', 'Arma dei Carabinieri', 'Altro'];
            fondi = fondi.sort((a, b) => {
                const indexA = ordineFondi.indexOf(a.nome);
                const indexB = ordineFondi.indexOf(b.nome);
                if (indexA === -1 && indexB === -1) return a.nome.localeCompare(b.nome);
                if (indexA === -1) return 1;
                if (indexB === -1) return -1;
                return indexA - indexB;
            });

            const materialePerFondo = {};
            materiale.forEach(m => {
                materialePerFondo[m.fondo] = (materialePerFondo[m.fondo] || 0) + 1;
            });

            const immaginiFondi = {
                'Fondi Europei': 'immagini/europa.jpeg',
                'Europol': 'immagini/europol.png',
                'Arma dei Carabinieri': 'immagini/cc.png',
                'Altro': 'immagini/bitcoin.jpg'
            };

            const fondiHTML = `
                <div class="stats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                    ${fondi.map(fondo => {
                        const budgetIniziale = parseFloat(fondo.budgetIniziale) || 0;
                        const budgetResiduo = parseFloat(fondo.budgetResiduo) || 0;
                        const budgetSpeso = budgetIniziale - budgetResiduo;
                        const percentualeRimanente = budgetIniziale > 0 ? parseFloat(((budgetResiduo / budgetIniziale) * 100).toFixed(1)) : 100;
                        const materialeCount = materialePerFondo[fondo.nome] || 0;
                        const fondoImage = immaginiFondi[fondo.nome] 
                            ? `<img src="${escapeAttr(immaginiFondi[fondo.nome])}" alt="${escapeAttr(fondo.nome)}" style="height: 2em; width: 2.5em; object-fit: contain; margin-right: 8px; vertical-align: middle;">`
                            : '';
                        
                        const backgroundImages = {
                            'Fondi Europei': 'immagini/europa.jpeg',
                            'Europol': 'immagini/europolflag.gif',
                            'Arma dei Carabinieri': 'immagini/cc.jpg'
                        };
                        const backgroundImage = backgroundImages[fondo.nome] 
                            ? `background-image: url('${backgroundImages[fondo.nome]}') !important; background-size: cover !important; background-position: center !important; background-repeat: no-repeat !important;`
                            : '';

                        return `
                            <div class="stat-card badge ${getFondoBadgeClass(fondo.nome)}" style="display: flex; flex-direction: column; gap: 15px; padding: 20px; border-radius: var(--border-radius); position: relative; overflow: hidden; color: white !important; ${backgroundImage}">
                                ${backgroundImage ? '<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.3); z-index: 0; pointer-events: none;"></div>' : ''}
                                <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 15px; position: relative; z-index: 1;">
                                    <div style="display: flex; align-items: center; font-size: 1.2em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-family: 'Orbitron', monospace; color: white !important;">
                                        ${fondoImage}<span style="color: white !important;">${escapeHtml(fondo.nome)}</span>
                                    </div>
                                </div>
                                ${fondo.capitolo ? `<div style="position: relative; z-index: 1;"><p style="margin: 0 0 8px 0; font-size: 0.9em; font-weight: 600; opacity: 0.95; font-family: 'Inter', sans-serif; color: white !important;">Capitolo: ${escapeHtml(fondo.capitolo)}</p></div>` : ''}
                                <div style="position: relative; z-index: 1;">
                                    <h3 style="margin: 0; font-size: 1.8em; font-weight: 700; font-family: 'Orbitron', monospace; color: white !important; background: none !important; -webkit-background-clip: unset !important; background-clip: unset !important; -webkit-text-fill-color: white !important;">€${budgetIniziale.toLocaleString('it-IT', {minimumFractionDigits: 2})}</h3>
                                    <p style="margin: 8px 0 0 0; font-size: 0.95em; font-weight: 600; opacity: 0.95; font-family: 'Inter', sans-serif; color: white !important;">Budget Iniziale</p>
                                </div>
                                <div style="position: relative; z-index: 1;">
                                    <h3 style="margin: 0; font-size: 1.8em; font-weight: 700; font-family: 'Orbitron', monospace; color: white !important; background: none !important; -webkit-background-clip: unset !important; background-clip: unset !important; -webkit-text-fill-color: white !important;">€${budgetResiduo.toLocaleString('it-IT', {minimumFractionDigits: 2})}</h3>
                                    <p style="margin: 8px 0 0 0; font-size: 0.95em; font-weight: 600; opacity: 0.95; font-family: 'Inter', sans-serif; color: white !important;"></p>
                                </div>
                                <div style="position: relative; z-index: 1;">
                                    <h3 style="margin: 0; font-size: 1.8em; font-weight: 700; font-family: 'Orbitron', monospace; color: white !important; background: none !important; -webkit-background-clip: unset !important; background-clip: unset !important; -webkit-text-fill-color: white !important;">${materialeCount}</h3>
                                    <p style="margin: 8px 0 0 0; font-size: 0.95em; font-weight: 600; opacity: 0.95; font-family: 'Inter', sans-serif; color: white !important;">Pezzi Materiale</p>
                                </div>
                                <div style="margin-top: auto; position: relative; z-index: 1;">
                                    <div style="display: flex; justify-content: center; margin-bottom: 8px;">
                                        <div style="position: relative; width: 100%; max-width: 200px; background: rgba(255, 255, 255, 0.25); border: 1px solid rgba(255, 255, 255, 0.4); padding: 2px; border-radius: 4px; backdrop-filter: blur(5px);">
                                            <div style="position: relative; background: rgba(59, 130, 246, 0.9); height: 20px; width: ${Math.min(percentualeRimanente, 100)}%; transition: width 0.3s; border-radius: 2px; display: flex; align-items: center; justify-content: center;">
                                                <small style="font-weight: bold; font-size: 0.85em; font-family: 'Orbitron', monospace; color: white; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);">${percentualeRimanente}%</small>
                                            </div>
                                        </div>
                                    </div>
                                    <p style="margin: 0; font-size: 0.9em; font-weight: 600; text-align: center; opacity: 0.95; font-family: 'Inter', sans-serif; color: white !important;">Percentuale Rimanente</p>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            document.getElementById('fondiResoconto').innerHTML = fondiHTML;
        }


        function renderMaterialeResoconto(materialeToRender = null) {
            const materiale = materialeToRender || loadMateriale();
            const fondi = loadFondi();

            if (materiale.length === 0) {
                document.getElementById('materialeResoconto').innerHTML = `
                    <p style="color: var(--text-secondary); text-align: center; padding: 20px;">
                        Nessun materiale trovato. <a href="materiale.html" style="color: var(--accent-primary);">Aggiungi il primo materiale</a>
                    </p>
                `;
                return;
            }

            const totale = materiale.length;
            const inMagazzino = materiale.filter(m => m.stato === 'Magazzino').length;
            const inUso = materiale.filter(m => m.stato === 'In Uso').length;
            let totaleCosto = 0;

            const materialePerFondo = {};
            const materialePerStato = {};

            materiale.forEach(m => {
                materialePerFondo[m.fondo] = (materialePerFondo[m.fondo] || 0) + 1;
                materialePerStato[m.stato] = (materialePerStato[m.stato] || 0) + 1;
                totaleCosto += parseFloat(m.costo) || 0;
            });

            const materialeHTML = `
                <div class="stats" style="margin-bottom: 20px;">
                    <div class="stat-card">
                        <h3>${totale}</h3>
                        <p>Totale Materiale</p>
                    </div>
                    <div class="stat-card">
                        <h3>${inMagazzino}</h3>
                        <p>In Magazzino</p>
                    </div>
                    <div class="stat-card">
                        <h3>${inUso}</h3>
                        <p>In Uso</p>
                    </div>
                    <div class="stat-card">
                        <h3>€${totaleCosto.toLocaleString('it-IT', {minimumFractionDigits: 2})}</h3>
                        <p>Valore Totale</p>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px;">
                    <div style="background: var(--bg-tertiary); border: 2px solid var(--accent-cyan); padding: 15px;">
                        <h3 style="color: var(--accent-cyan); margin-bottom: 10px; font-family: 'Orbitron', monospace;">Distribuzione per Fondo</h3>
                        ${Object.entries(materialePerFondo).map(([fondo, count]) => {
                            const immaginiFondi = {
                                'Fondi Europei': 'immagini/europa.jpeg',
                                'Europol': 'immagini/europol.png',
                                'Arma dei Carabinieri': 'immagini/cc.png',
                                'Altro': 'immagini/bitcoin.jpg'
                            };
                            const fondoImage = immaginiFondi[fondo] 
                                ? `<img src="${escapeAttr(immaginiFondi[fondo])}" alt="${escapeAttr(fondo)}" style="height: 1.5em; width: 2em; object-fit: contain; margin-right: 6px; vertical-align: middle;">`
                                : '';
                            return `
                            <div style="margin-bottom: 10px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 5px; align-items: center;">
                                    <span class="badge ${getFondoBadgeClass(fondo)}" style="display: flex; align-items: center; padding: 6px 12px;">
                                        ${fondoImage}<span>${escapeHtml(fondo)}</span>
                                    </span>
                                    <strong style="color: var(--text-primary);">${count}</strong>
                                </div>
                            </div>
                        `;
                        }).join('')}
                    </div>
                    <div style="background: var(--bg-tertiary); border: 2px solid var(--accent-green); padding: 15px;">
                        <h3 style="color: var(--accent-green); margin-bottom: 10px; font-family: 'Orbitron', monospace;">Distribuzione per Stato</h3>
                        ${Object.entries(materialePerStato).map(([stato, count]) => `
                            <div style="margin-bottom: 10px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                    <span class="badge ${stato === 'Magazzino' ? 'badge-magazzino' : 'badge-in-uso'}">${escapeHtml(stato)}</span>
                                    <strong style="color: var(--text-primary);">${count}</strong>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div style="background: var(--bg-tertiary); border: 2px solid var(--accent-purple); padding: 15px;">
                        <h3 style="color: var(--accent-purple); margin-bottom: 10px; font-family: 'Orbitron', monospace;">Valore Totale</h3>
                        <div style="font-size: 2em; color: var(--accent-purple); text-shadow: 0 0 10px var(--accent-purple);">
                            €${totaleCosto.toLocaleString('it-IT', {minimumFractionDigits: 2})}
                        </div>
                    </div>
                </div>
                <div class="table-section">
                    <table>
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Nome</th>
                                <th>Fondo</th>
                                <th>Stato</th>
                                <th>Utente</th>
                                <th>Costo</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${materiale.map(item => {
                                const immaginiFondi = {
                                    'Fondi Europei': 'immagini/europa.jpeg',
                                    'Europol': 'immagini/europol.png',
                                    'Arma dei Carabinieri': 'immagini/cc.png',
                                    'Altro': 'immagini/bitcoin.jpg'
                                };
                                const fondoImage = immaginiFondi[item.fondo] 
                                    ? `<img src="${escapeAttr(immaginiFondi[item.fondo])}" alt="${escapeAttr(item.fondo)}" style="height: 1.5em; width: 2em; object-fit: contain; margin-right: 6px; vertical-align: middle;">`
                                    : '';
                                // Compatibilità: se non c'è tipo, usa nome vecchio; se non c'è nome, usa modello vecchio
                                const tipo = item.tipo || item.nome || '-';
                                const nome = item.nome || item.modello || '-';
                                return `
                                <tr>
                                    <td>${escapeHtml(tipo)}</td>
                                    <td>${escapeHtml(nome)}</td>
                                    <td>
                                        <span class="badge ${getFondoBadgeClass(item.fondo)}" style="display: flex; align-items: center; padding: 6px 12px;">
                                            ${fondoImage}<span>${escapeHtml(item.fondo)}</span>
                                        </span>
                                    </td>
                                    <td><span class="badge ${item.stato === 'Magazzino' ? 'badge-magazzino' : 'badge-in-uso'}">${escapeHtml(item.stato)}</span></td>
                                    <td>${escapeHtml(item.utente || '-')}</td>
                                    <td>${parseFloat(item.costo) > 0 ? '€' + parseFloat(item.costo).toLocaleString('it-IT', {minimumFractionDigits: 2}) : '-'}</td>
                                </tr>
                            `;
                            }).join('')}
                        </tbody>
                    </table>
                    ${materiale.length > 0 ? `<p style="text-align: center; padding: 15px; color: var(--text-secondary);">Mostrati ${materiale.length} elementi. <a href="materiale.html" style="color: var(--accent-primary);">Gestisci materiale →</a></p>` : ''}
                </div>
            `;

            document.getElementById('materialeResoconto').innerHTML = materialeHTML;
        }

        function filterAndSortMateriale() {
            const materiale = loadMateriale();
            const fondi = loadFondi();
            
            const filterText = document.getElementById('materialeFilter').value.toLowerCase();
            const filterFondo = document.getElementById('materialeFilterFondo').value;
            const filterStato = document.getElementById('materialeFilterStato').value;
            
            let filtered = materiale.filter(item => {
                const matchText = !filterText || 
                    item.nome.toLowerCase().includes(filterText) ||
                    (item.modello && item.modello.toLowerCase().includes(filterText)) ||
                    (item.seriale && item.seriale.toLowerCase().includes(filterText));
                const matchFondo = !filterFondo || item.fondo === filterFondo;
                const matchStato = !filterStato || item.stato === filterStato;
                return matchText && matchFondo && matchStato;
            });

            const sortValue = document.getElementById('materialeSort').value;
            filtered.sort((a, b) => {
                switch(sortValue) {
                    case 'nome-asc':
                        return a.nome.localeCompare(b.nome);
                    case 'nome-desc':
                        return b.nome.localeCompare(a.nome);
                    case 'costo-asc':
                        return (parseFloat(a.costo) || 0) - (parseFloat(b.costo) || 0);
                    case 'costo-desc':
                        return (parseFloat(b.costo) || 0) - (parseFloat(a.costo) || 0);
                    case 'fondo-asc':
                        return (a.fondo || '').localeCompare(b.fondo || '');
                    case 'fondo-desc':
                        return (b.fondo || '').localeCompare(a.fondo || '');
                    default:
                        return 0;
                }
            });

            materialeData = filtered;
            renderMaterialeResoconto(filtered);
        }

        function renderLicenzeResoconto(licenzeToRender = null) {
            const licenze = licenzeToRender || loadLicenze();
            const fondi = loadFondi();

            if (licenze.length === 0) {
                document.getElementById('licenzeResoconto').innerHTML = `
                    <p style="color: var(--text-secondary); text-align: center; padding: 20px;">
                        Nessuna licenza trovata. <a href="licenze.html" style="color: var(--accent-primary);">Aggiungi la prima licenza</a>
                    </p>
                `;
                return;
            }

            const totale = licenze.length;
            const attive = licenze.filter(l => getStatoLicenza(l.dataScadenza) === 'attiva').length;
            const inScadenza = licenze.filter(l => getStatoLicenza(l.dataScadenza) === 'in-scadenza').length;
            const scadute = licenze.filter(l => getStatoLicenza(l.dataScadenza) === 'scaduta').length;
            let totaleCosto = 0;

            const licenzePerStato = {};

            licenze.forEach(l => {
                const stato = getStatoLicenza(l.dataScadenza);
                licenzePerStato[stato] = (licenzePerStato[stato] || 0) + 1;
                totaleCosto += parseFloat(l.costo) || 0;
            });

            const immaginiFondi = {
                'Fondi Europei': 'immagini/europa.jpeg',
                'Europol': 'immagini/europol.png',
                'Arma dei Carabinieri': 'immagini/cc.png',
                'Altro': 'immagini/bitcoin.jpg'
            };

            const licenzeHTML = `
                <div class="stats" style="margin-bottom: 20px;">
                    <div class="stat-card">
                        <h3>${totale}</h3>
                        <p>Totale Licenze</p>
                    </div>
                    <div class="stat-card">
                        <h3>${attive}</h3>
                        <p>Attive</p>
                    </div>
                    <div class="stat-card">
                        <h3>${inScadenza}</h3>
                        <p>In Scadenza</p>
                    </div>
                    <div class="stat-card">
                        <h3>${scadute}</h3>
                        <p>Scadute</p>
                    </div>
                    <div class="stat-card">
                        <h3>€${totaleCosto.toLocaleString('it-IT', {minimumFractionDigits: 2})}</h3>
                        <p>Valore Totale</p>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px;">
                    <div style="background: var(--bg-tertiary); border: 2px solid var(--accent-cyan); padding: 15px;">
                        <h3 style="color: var(--accent-cyan); margin-bottom: 10px; font-family: 'Orbitron', monospace;">Distribuzione per Stato</h3>
                        ${Object.entries(licenzePerStato).map(([stato, count]) => `
                            <div style="margin-bottom: 10px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                    <span class="badge ${getStatoBadgeClass(stato)}">${stato === 'attiva' ? 'Attiva' : stato === 'in-scadenza' ? 'In Scadenza' : 'Scaduta'}</span>
                                    <strong style="color: var(--text-primary);">${count}</strong>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div style="background: var(--bg-tertiary); border: 2px solid var(--accent-purple); padding: 15px;">
                        <h3 style="color: var(--accent-purple); margin-bottom: 10px; font-family: 'Orbitron', monospace;">Valore Totale</h3>
                        <div style="font-size: 2em; color: var(--accent-purple); text-shadow: 0 0 10px var(--accent-purple);">
                            €${totaleCosto.toLocaleString('it-IT', {minimumFractionDigits: 2})}
                        </div>
                    </div>
                </div>
                <div class="table-section">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Tipo</th>
                                <th>Fondo</th>
                                <th>Data Scadenza</th>
                                <th>Stato</th>
                                <th>Costo</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${licenze.map(item => {
                                const immaginiFondi = {
                                    'Fondi Europei': 'immagini/europa.jpeg',
                                    'Europol': 'immagini/europol.png',
                                    'Arma dei Carabinieri': 'immagini/cc.png',
                                    'Altro': 'immagini/bitcoin.jpg'
                                };
                                const fondoImage = immaginiFondi[item.fondo] 
                                    ? `<img src="${escapeAttr(immaginiFondi[item.fondo])}" alt="${escapeAttr(item.fondo)}" style="height: 1.5em; width: 2em; object-fit: contain; margin-right: 6px; vertical-align: middle;">`
                                    : '';
                                const stato = getStatoLicenza(item.dataScadenza);
                                const giorniRimanenti = item.dataScadenza ? Math.ceil((new Date(item.dataScadenza) - new Date()) / (1000 * 60 * 60 * 24)) : 0;
                                const statoText = giorniRimanenti < 0 ? `Scaduta (${Math.abs(giorniRimanenti)} giorni fa)` : 
                                                  giorniRimanenti <= 30 ? `In Scadenza (${giorniRimanenti} giorni)` : 
                                                  `Attiva (${giorniRimanenti} giorni)`;
                                
                                return `
                                <tr>
                                    <td>${escapeHtml(item.nome)}</td>
                                    <td>${escapeHtml(item.tipo || '-')}</td>
                                    <td>
                                        <span class="badge ${getFondoBadgeClass(item.fondo)}" style="display: flex; align-items: center; padding: 6px 12px;">
                                            ${fondoImage}<span>${escapeHtml(item.fondo)}</span>
                                        </span>
                                    </td>
                                    <td>${escapeHtml(item.dataScadenza || '-')}</td>
                                    <td><span class="badge ${getStatoBadgeClass(stato)}">${escapeHtml(statoText)}</span></td>
                                    <td>${parseFloat(item.costo) > 0 ? '€' + parseFloat(item.costo).toLocaleString('it-IT', {minimumFractionDigits: 2}) : '-'}</td>
                                </tr>
                            `;
                            }).join('')}
                        </tbody>
                    </table>
                    ${licenze.length > 0 ? `<p style="text-align: center; padding: 15px; color: var(--text-secondary);">Mostrati ${licenze.length} elementi. <a href="licenze.html" style="color: var(--accent-primary);">Gestisci licenze →</a></p>` : ''}
                </div>
            `;

            document.getElementById('licenzeResoconto').innerHTML = licenzeHTML;
        }

        function filterAndSortLicenze() {
            const licenze = loadLicenze();
            
            const filterText = document.getElementById('licenzeFilter').value.toLowerCase();
            const filterStato = document.getElementById('licenzeFilterStato').value;
            
            let filtered = licenze.filter(item => {
                const matchText = !filterText || 
                    item.nome.toLowerCase().includes(filterText) ||
                    (item.tipo && item.tipo.toLowerCase().includes(filterText));
                const matchStato = !filterStato || getStatoLicenza(item.dataScadenza) === filterStato;
                return matchText && matchStato;
            });

            const sortValue = document.getElementById('licenzeSort').value;
            filtered.sort((a, b) => {
                switch(sortValue) {
                    case 'nome-asc':
                        return a.nome.localeCompare(b.nome);
                    case 'nome-desc':
                        return b.nome.localeCompare(a.nome);
                    case 'dataScadenza-asc':
                        const dateA = a.dataScadenza ? new Date(a.dataScadenza).getTime() : 0;
                        const dateB = b.dataScadenza ? new Date(b.dataScadenza).getTime() : 0;
                        return dateA - dateB;
                    case 'dataScadenza-desc':
                        const dateA2 = a.dataScadenza ? new Date(a.dataScadenza).getTime() : 0;
                        const dateB2 = b.dataScadenza ? new Date(b.dataScadenza).getTime() : 0;
                        return dateB2 - dateA2;
                    case 'costo-asc':
                        return (parseFloat(a.costo) || 0) - (parseFloat(b.costo) || 0);
                    case 'costo-desc':
                        return (parseFloat(b.costo) || 0) - (parseFloat(a.costo) || 0);
                    default:
                        return 0;
                }
            });

            renderLicenzeResoconto(filtered);
        }

        function populateMaterialeFondoFilter() {
            const fondi = loadFondi();
            const select = document.getElementById('materialeFilterFondo');
            select.innerHTML = '<option value="">Tutti i fondi</option>';
            fondi.forEach(fondo => {
                const option = document.createElement('option');
                option.value = fondo.nome;
                option.textContent = fondo.nome;
                select.appendChild(option);
            });
        }

        function performGlobalSearch() {
            const searchTerm = document.getElementById('globalSearch').value.toLowerCase();
            
            if (!searchTerm) {
                // Se la ricerca è vuota, mostra tutti i fondi
                renderFondiResoconto();
                filterAndSortMateriale();
                filterAndSortLicenze();
                return;
            }

            // Cerca nei fondi
            const fondi = loadFondi();
            let fondiFiltered = fondi.filter(fondo => 
                fondo.nome.toLowerCase().includes(searchTerm)
            );
            renderFondiResoconto(fondiFiltered);

            // Cerca nel materiale (applica anche i filtri esistenti)
            const materiale = loadMateriale();
            const materialeFilterText = document.getElementById('materialeFilter').value.toLowerCase();
            const materialeFilterFondo = document.getElementById('materialeFilterFondo').value;
            const materialeFilterStato = document.getElementById('materialeFilterStato').value;
            
            let materialeFiltered = materiale.filter(item => {
                const matchGlobalSearch = 
                    item.nome.toLowerCase().includes(searchTerm) ||
                    (item.modello && item.modello.toLowerCase().includes(searchTerm)) ||
                    (item.seriale && item.seriale.toLowerCase().includes(searchTerm)) ||
                    (item.fondo && item.fondo.toLowerCase().includes(searchTerm)) ||
                    (item.utente && item.utente.toLowerCase().includes(searchTerm));
                const matchText = !materialeFilterText || 
                    item.nome.toLowerCase().includes(materialeFilterText) ||
                    (item.modello && item.modello.toLowerCase().includes(materialeFilterText)) ||
                    (item.seriale && item.seriale.toLowerCase().includes(materialeFilterText));
                const matchFondo = !materialeFilterFondo || item.fondo === materialeFilterFondo;
                const matchStato = !materialeFilterStato || item.stato === materialeFilterStato;
                return matchGlobalSearch && matchText && matchFondo && matchStato;
            });

            // Applica ordinamento
            const materialeSortValue = document.getElementById('materialeSort').value;
            materialeFiltered.sort((a, b) => {
                switch(materialeSortValue) {
                    case 'nome-asc':
                        return a.nome.localeCompare(b.nome);
                    case 'nome-desc':
                        return b.nome.localeCompare(a.nome);
                    case 'costo-asc':
                        return (parseFloat(a.costo) || 0) - (parseFloat(b.costo) || 0);
                    case 'costo-desc':
                        return (parseFloat(b.costo) || 0) - (parseFloat(a.costo) || 0);
                    case 'fondo-asc':
                        return (a.fondo || '').localeCompare(b.fondo || '');
                    case 'fondo-desc':
                        return (b.fondo || '').localeCompare(a.fondo || '');
                    default:
                        return 0;
                }
            });
            renderMaterialeResoconto(materialeFiltered);

            // Cerca nelle licenze
            const licenze = loadLicenze();
            const licenzeFilterText = document.getElementById('licenzeFilter').value.toLowerCase();
            const licenzeFilterStato = document.getElementById('licenzeFilterStato').value;
            
            let licenzeFiltered = licenze.filter(item => {
                const matchGlobalSearch = 
                    item.nome.toLowerCase().includes(searchTerm) ||
                    (item.tipo && item.tipo.toLowerCase().includes(searchTerm)) ||
                    (item.fondo && item.fondo.toLowerCase().includes(searchTerm));
                const matchText = !licenzeFilterText || 
                    item.nome.toLowerCase().includes(licenzeFilterText) ||
                    (item.tipo && item.tipo.toLowerCase().includes(licenzeFilterText));
                const matchStato = !licenzeFilterStato || getStatoLicenza(item.dataScadenza) === licenzeFilterStato;
                return matchGlobalSearch && matchText && matchStato;
            });

            // Applica ordinamento
            const licenzeSortValue = document.getElementById('licenzeSort').value;
            licenzeFiltered.sort((a, b) => {
                switch(licenzeSortValue) {
                    case 'nome-asc':
                        return a.nome.localeCompare(b.nome);
                    case 'nome-desc':
                        return b.nome.localeCompare(a.nome);
                    case 'dataScadenza-asc':
                        const dateA = a.dataScadenza ? new Date(a.dataScadenza).getTime() : 0;
                        const dateB = b.dataScadenza ? new Date(b.dataScadenza).getTime() : 0;
                        return dateA - dateB;
                    case 'dataScadenza-desc':
                        const dateA2 = a.dataScadenza ? new Date(a.dataScadenza).getTime() : 0;
                        const dateB2 = b.dataScadenza ? new Date(b.dataScadenza).getTime() : 0;
                        return dateB2 - dateA2;
                    case 'costo-asc':
                        return (parseFloat(a.costo) || 0) - (parseFloat(b.costo) || 0);
                    case 'costo-desc':
                        return (parseFloat(b.costo) || 0) - (parseFloat(a.costo) || 0);
                    default:
                        return 0;
                }
            });
            renderLicenzeResoconto(licenzeFiltered);
        }

        // Inizializzazione
        renderGeneralStats();
        populateMaterialeFondoFilter();
        renderFondiResoconto();
        filterAndSortMateriale();
        filterAndSortLicenze();

        document.getElementById('globalSearch').addEventListener('input', performGlobalSearch);
        document.getElementById('materialeFilter').addEventListener('input', filterAndSortMateriale);
        document.getElementById('materialeFilterFondo').addEventListener('change', filterAndSortMateriale);
        document.getElementById('materialeFilterStato').addEventListener('change', filterAndSortMateriale);
        document.getElementById('materialeSort').addEventListener('change', filterAndSortMateriale);
        document.getElementById('licenzeFilter').addEventListener('input', filterAndSortLicenze);
        document.getElementById('licenzeFilterStato').addEventListener('change', filterAndSortLicenze);
        document.getElementById('licenzeSort').addEventListener('change', filterAndSortLicenze);

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        function initTheme() {
            const savedTheme = sessionStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme) {
                html.setAttribute('data-theme', savedTheme);
            } else if (prefersDark) {
                html.setAttribute('data-theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
            }
            updateThemeIcon();
        }

        function toggleTheme() {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            sessionStorage.setItem('theme', newTheme);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const currentTheme = html.getAttribute('data-theme');
            themeIcon.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        }

        themeToggle.addEventListener('click', toggleTheme);
        initTheme();
    </script>
</body>
</html>
