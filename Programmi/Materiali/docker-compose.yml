services:
  db:
    image: postgres:16-alpine
    container_name: materiali-db
    environment:
      POSTGRES_DB: materiali
      POSTGRES_USER: materiali
      POSTGRES_PASSWORD: materiali
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U materiali -d materiali"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: materiali-api
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://materiali:materiali@db:5432/materiali
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    ports:
      - "${PORT:-3000}:80"
    container_name: materiali-web
    depends_on:
      - api

volumes:
  pgdata:
