upstream cluster_app {
    server cluster:3000;
}

upstream auth_app {
    server auth:4000;
}

upstream analisi_app {
    server analisi:5001;
}

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html;
    index index.html;

    # Auth API
    location /api/auth/ {
        proxy_pass         http://auth_app/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Pagina portale protetta
    location = /portal {
        try_files /portal.html =404;
    }

    # Gestione Utenti (pagina admin)
    location = /gestione-utenti {
        try_files /gestione-utenti.html =404;
    }

    # Pagina profilo utente
    location = /profilo {
        try_files /profilo.html =404;
    }

    # Analisi Report
    location = /analisi-report {
        try_files /analisi-report.html =404;
    }

    # Corsi (materiali Markdown, tema Hyde)
    location = /corsi {
        try_files /corsi.html =404;
    }

    location = /corsi-storico {
        try_files /corsi-storico.html =404;
    }

    location = /corsi-gestione {
        try_files /corsi-gestione.html =404;
    }

    location /api/analisi/ {
        client_max_body_size 30m;
        proxy_pass         http://analisi_app/api/analisi/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Pagina login
    location = /login {
        try_files /login.html =404;
    }

    # Pagina registrazione
    location = /register {
        try_files /register.html =404;
    }

    # Strumento Cluster — proxy verso il servizio Node.js
    location /cluster/ {
        proxy_pass         http://cluster_app/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Supporto SSE (Server-Sent Events)
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
