services:
  web:
    build: .
    container_name: cryptovault-web
    ports:
      - "5200:443"
      - "5201:80"
    restart: unless-stopped
    depends_on:
      - cluster
      - auth
    volumes:
      - ./:/usr/share/nginx/html:ro

  cluster:
    build:
      context: ./cluster
      dockerfile: Dockerfile
    container_name: cryptovault-cluster
    restart: unless-stopped
    volumes:
      - ./cluster/dashboard/uploads:/app/dashboard/uploads

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: cryptovault-auth
    restart: unless-stopped
    extra_hosts:
      - "host-gateway:host-gateway"
    environment:
      - PORTAL_URL=${PORTAL_URL:-https://192.168.4.77:5200}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - ./auth/data:/app/data
