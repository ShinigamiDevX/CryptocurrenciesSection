<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Reset password — CryptocurrenciesSection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" referrerpolicy="no-referrer">
    <script src="seasonal-theme.js?v=4"></script>
    <link rel="stylesheet" href="seasonal-theme.css?v=9">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #030E1C;
            color: #C8F0E8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: rgba(3, 12, 28, 0.97);
            border: 1px solid rgba(0,200,255,0.18);
            border-radius: 16px;
            padding: 2.8rem 2.4rem 2.4rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 0 1px rgba(0,200,255,0.1), 0 32px 80px rgba(0,0,0,0.7);
        }
        .logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
        .logo img { height: 2.8rem; }
        .logo-text { font-size: 1.1rem; font-weight: 700; color: #C8F0E8; }
        .logo-text span { color: #00C8FF; }
        h2 { font-size: 1.45rem; font-weight: 700; color: #00C8FF; margin-bottom: 0.4rem; }
        .subtitle { font-size: 0.85rem; color: #5ABBC8; margin-bottom: 2rem; }
        .email-box {
            background: rgba(0,200,255,0.08);
            border: 1px solid rgba(0,200,255,0.25);
            border-radius: 8px;
            padding: 0.7rem 1rem;
            font-size: 0.9rem;
            color: #00C8FF;
            margin-bottom: 1.4rem;
            word-break: break-all;
        }
        .field { margin-bottom: 1.2rem; }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #7ACCE0;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.45rem;
        }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(0,200,255,0.06);
            border: 1px solid rgba(0,200,255,0.22);
            border-radius: 8px;
            color: #C8F0E8;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: rgba(0,200,255,0.6); }
        .btn {
            width: 100%;
            padding: 0.85rem;
            margin-top: 0.6rem;
            background: linear-gradient(135deg, #00C8FF 0%, #00E676 100%);
            border: none;
            border-radius: 8px;
            color: #030E1C;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn:hover { opacity: 0.88; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .msg { border-radius: 8px; font-size: 0.85rem; padding: 0.7rem 1rem; margin-bottom: 1.2rem; display: none; }
        .msg.error   { background: rgba(255,71,87,0.12); border: 1px solid rgba(255,71,87,0.35); color: #FF6B7A; }
        .msg.success { background: rgba(0,230,118,0.12); border: 1px solid rgba(0,230,118,0.35); color: #00E676; }
        .back { display: block; text-align: center; margin-top: 1.2rem; color: #5ABBC8; font-size: 0.85rem; text-decoration: none; }
        .back:hover { color: #00C8FF; }
        footer { margin-top: 2rem; font-size: 0.75rem; color: rgba(90,187,200,0.45); text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="immagini/logo.png" alt="Logo">
            <div class="logo-text">Cryptocurrencies<span>Section</span></div>
        </div>
        <h2>Nuova password</h2>
        <p class="subtitle">Imposta una nuova password per il tuo account</p>
        <div class="msg error" id="errorMsg"></div>
        <div class="msg success" id="successMsg"></div>
        <div id="formBlock">
            <div class="email-box" id="emailBox">Verifica link...</div>
            <form id="resetForm">
                <div class="field">
                    <label for="password">Nuova password</label>
                    <input type="password" id="password" placeholder="Minimo 8 caratteri" autocomplete="new-password" required>
                </div>
                <div class="field">
                    <label for="confirm">Conferma password</label>
                    <input type="password" id="confirm" placeholder="Ripeti la password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn" id="submitBtn">Salva password</button>
            </form>
        </div>
        <a class="back" href="/login">Torna al login</a>
    </div>
    <footer>Uso interno riservato. Accesso non autorizzato è perseguibile a norma di legge.</footer>

    <script src="password-toggle.js?v=1"></script>
    <script>
        // Preferisci #token= (non inviato al server); fallback ?token= per link vecchi
        function readResetToken() {
            const hash = (window.location.hash || '').replace(/^#/, '');
            const fromHash = new URLSearchParams(hash).get('token');
            if (fromHash) return fromHash;
            return new URLSearchParams(window.location.search).get('token');
        }
        const token = readResetToken();
        if (window.location.hash || window.location.search) {
            try { history.replaceState(null, '', window.location.pathname); } catch { /* ignore */ }
        }
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const formBlock = document.getElementById('formBlock');
        const emailBox = document.getElementById('emailBox');
        const form = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');

        function showError(text) {
            errorMsg.textContent = text;
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
        }

        (async function() {
            if (!token) {
                showError('Link non valido.');
                formBlock.style.display = 'none';
                return;
            }
            try {
                const res = await fetch('/api/auth/reset-info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token }),
                });
                const data = await res.json();
                if (!res.ok) {
                    showError(data.error || 'Link non valido.');
                    formBlock.style.display = 'none';
                    return;
                }
                emailBox.textContent = data.email;
            } catch {
                showError('Errore di rete. Riprovare.');
                formBlock.style.display = 'none';
            }
        })();

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            if (password.length < 8) {
                showError('La password deve essere di almeno 8 caratteri.');
                return;
            }
            if (password !== confirm) {
                showError('Le password non coincidono.');
                return;
            }
            submitBtn.disabled = true;
            submitBtn.textContent = 'Salvataggio...';
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    showError(data.error || 'Errore. Riprovare.');
                } else {
                    formBlock.style.display = 'none';
                    successMsg.textContent = 'Password aggiornata. Ora puoi accedere.';
                    successMsg.style.display = 'block';
                    setTimeout(() => { window.location.replace('/login'); }, 2000);
                }
            } catch {
                showError('Errore di rete. Riprovare.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Salva password';
            }
        });
    </script>
</body>
</html>
